# Nova Classic: samme Nova-motor, men på etablerede memecoins i stedet for nye lanceringer.
# Egen mappe til data, så den ikke blander sig med Nova (runs/).
data_dir = "runs-classic"
scan_interval_seconds = 120     # gamle coins bevæger sig langsommere; skåner en lille server

[scout]
min_pair_age_minutes = 43200      # mindst 30 dage gammel
max_pair_age_hours = 87600        # ingen øvre grænse i praksis
min_mcap_usd = 20000000
max_mcap_usd = 5000000000

[filter]
min_lp_locked_pct = 0             # gamle coins har sjældent låst LP
min_liquidity_usd = 250000
min_volume_1h_usd = 100000
max_top10_pct = 60
max_dev_pct = 10
max_dev_dead_launches = 99
max_bundle_pct = 40
max_price_change_1h_pct = 40
